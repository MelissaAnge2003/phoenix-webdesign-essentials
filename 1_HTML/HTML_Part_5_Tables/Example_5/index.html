<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Tables</title>
        <link rel="stylesheet" href="style.css" />
    </head>

    <body style="background-image: url(&quot;pexels-van-mailian-2150452657-32047220.jpg&quot;)">
        <h1>Working with tables</h1>

        <article>
            <h2>Simple table</h2>
            <table>
                <tr>
                    <td>Webdesign Essentials</td>
                    <td>Brent</td>
                </tr>
                <tr>
                    <td>Programming Essentials</td>
                    <td>Jitse Beyens</td>
                </tr>
                <tr>
                    <td>Operating Systems</td>
                    <td>Quinten Desmyter</td>
                </tr>
            </table>
        </article>

        <article>
            <h2>Table with header and caption</h2>
            <table>
                <caption>
                    Student grades
                </caption>
                <tr>
                    <th>Student</th>
                    <th>Web Essentials</th>
                    <th>Data Essentials</th>
                    <th>Skill1</th>
                </tr>
                <tr>
                    <td>Ange Melissa ISHIMWE</td>
                    <td>12/20</td>
                    <td>14/20</td>
                    <td>15/20</td>
                </tr>
                <tr>
                    <td>John</td>
                    <td>2/20</td>
                    <td>2/20</td>
                    <td>7/20</td>
                </tr>
            </table>
        </article>
    </body>
</html>
